name: unipay-backend

services:
  db:
    build:
      context: ./unipay-backend
      dockerfile: db/Dockerfile
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uniPay}
      MYSQL_USER: ${MYSQL_USER:-unipay_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-unipay-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-unipay-root-local-only}
    volumes:
      - unipay_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./unipay-backend
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-uniPay}
      DB_USER: ${MYSQL_USER:-unipay_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-unipay-local-only}
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-this-secret-before-deployment-2026}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./unipay-frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  unipay_mysql_data:
